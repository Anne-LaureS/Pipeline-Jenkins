<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-label="Les 3 jobs du catalogue TP7 partagent le même agent Jenkins mais n'utilisent chacun que le credential dont ils ont besoin : tp7-inventaire et tp7-nettoyage n'utilisent que le credential AWS CLI, tp7-deploiement seul combine AWS CLI et Ansible.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>

    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>

  <!-- Prelude: GitHub -> Controller -> Agent -->
  <rect x="20" y="20" width="150" height="50" rx="10" fill="url(#gGray)" stroke="#334155" stroke-width="1.5"/>
  <text x="95" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">GitHub</text>

  <path d="M170,45 L220,45" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="20" width="220" height="50" rx="10" fill="url(#gGray)" stroke="#334155" stroke-width="1.5"/>
  <text x="330" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Jenkins Controller (TP1)</text>

  <path d="M330,70 L330,100" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="100" width="220" height="50" rx="10" fill="url(#gBlue)" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="242" cy="125" r="10" fill="#1d4ed8"/>
  <rect x="238" y="121" width="8" height="8" rx="1.5" fill="none" stroke="#eff6ff" stroke-width="1.2"/>
  <text x="335" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">Agent aws-lab (TP4)</text>

  <!-- branch lines down to each job row: single trunk at x=20 (left of all badges), then a short
       branch into each badge's left edge — avoids crossing through any badge -->
  <path d="M330,150 L330,165 L20,165 L20,502" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3"/>
  <path d="M20,212 L40,212" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3"/>
  <path d="M20,337 L40,337" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3"/>
  <path d="M20,502 L40,502" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3"/>

  <!-- Row 1: tp7-inventaire -->
  <rect x="40" y="195" width="180" height="34" rx="8" fill="url(#gSlate)" stroke="#334155" stroke-width="1.4"/>
  <text x="130" y="217" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">tp7-inventaire</text>

  <path d="M220,212 L640,212" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <rect x="330" y="196" width="180" height="18" fill="#ffffff" opacity="0.9"/>
  <text x="420" y="209" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1d4ed8">credential: aws-jenkins-lab</text>

  <rect x="640" y="185" width="300" height="55" rx="10" fill="url(#gBlue)" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="790" y="207" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">AWS API — lecture seule</text>
  <text x="790" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">identité, inventaire EC2, inventaire SG</text>

  <!-- Row 2: tp7-deploiement -->
  <rect x="40" y="320" width="180" height="34" rx="8" fill="url(#gSlate)" stroke="#334155" stroke-width="1.4"/>
  <text x="130" y="342" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">tp7-deploiement</text>

  <path d="M220,330 L640,300" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <rect x="350" y="298" width="180" height="18" fill="#ffffff" opacity="0.9"/>
  <text x="440" y="311" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1d4ed8">credential: aws-jenkins-lab</text>

  <rect x="640" y="270" width="300" height="55" rx="10" fill="url(#gBlue)" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="790" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">AWS API — créer + tagger le SG</text>
  <text x="790" y="309" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">Security Group taggé (Owner, Course…)</text>

  <path d="M220,345 L640,395" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <rect x="350" y="380" width="230" height="18" fill="#ffffff" opacity="0.9"/>
  <text x="465" y="393" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c2410c">clé automation · credential: ssh-ansible-web-lab</text>

  <rect x="640" y="368" width="300" height="55" rx="10" fill="url(#gAmber)" stroke="#c2410c" stroke-width="1.5"/>
  <text x="790" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#7c2d12">web01 (web_lab) — via Ansible</text>
  <text x="790" y="407" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9a3412">playbook appliqué, idempotent</text>

  <!-- Row 3: tp7-nettoyage -->
  <rect x="40" y="485" width="180" height="34" rx="8" fill="url(#gSlate)" stroke="#334155" stroke-width="1.4"/>
  <text x="130" y="507" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">tp7-nettoyage</text>

  <path d="M220,502 L640,502" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <rect x="330" y="486" width="180" height="18" fill="#ffffff" opacity="0.9"/>
  <text x="420" y="499" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1d4ed8">credential: aws-jenkins-lab</text>

  <rect x="640" y="475" width="300" height="55" rx="10" fill="url(#gBlue)" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="790" y="497" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">AWS API — supprimer le SG</text>
  <text x="790" y="514" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">à partir de l'ID donné en paramètre</text>

  <!-- Caption note -->
  <text x="40" y="580" font-family="sans-serif" font-size="11" fill="#475569">Seul <tspan font-weight="700">tp7-deploiement</tspan> combine les deux credentials — les deux autres jobs n'en demandent qu'un seul,</text>
  <text x="40" y="597" font-family="sans-serif" font-size="11" fill="#475569">jamais les deux par facilité (principe de moindre privilège appliqué au niveau Jenkins).</text>
</svg>
